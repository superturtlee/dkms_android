name: Build Modules

on:
  workflow_dispatch:
  push:
    paths:
      - 'magisk_modules/dkms-manager/**'
      - 'magisk_modules/dkms-toolchain/**'

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: echo "VERSION=$(grep '^version=' magisk_modules/dkms-toolchain/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Download LLVM toolchain
        run: |
          curl -L --progress-bar \
            -o magisk_modules/dkms-toolchain/toolchain.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.0/clang+llvm-19.1.0-aarch64-linux-gnu.tar.xz

      - name: Package module
        run: |
          cd magisk_modules/dkms-toolchain
          zip -r ../../dkms-toolchain-${{ steps.ver.outputs.VERSION }}.zip . -x '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dkms-toolchain-${{ steps.ver.outputs.VERSION }}
          path: dkms-toolchain-*.zip

  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: echo "VERSION=$(grep '^version=' magisk_modules/dkms-manager/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Package module
        run: |
          cd magisk_modules/dkms-manager
          zip -r ../../dkms-manager-${{ steps.ver.outputs.VERSION }}.zip . -x '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dkms-manager-${{ steps.ver.outputs.VERSION }}
          path: dkms-manager-*.zip

  release:
    needs: [toolchain, manager]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get versions
        id: ver
        run: |
          echo "TC=$(grep '^version=' magisk_modules/dkms-toolchain/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "MGR=$(grep '^version=' magisk_modules/dkms-manager/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "TAG=build-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: "DKMS Modules (toolchain ${{ steps.ver.outputs.TC }}, manager ${{ steps.ver.outputs.MGR }})"
          files: artifacts/*.zip
          make_latest: true
